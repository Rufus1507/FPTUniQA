project:
  name: "FPTUniQA"
  version: "0.1.0"
  description: "FPTUniQA RAG System"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  corpus_path: "data/processed/corpus.jsonl"
  structured_path: "data/processed/structured_data.json"
  metadata_path: "data/processed/metadata.json"
  chunk_size: 512
  chunk_overlap: 64

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    top_k: 20
    tokenizer: "pyvi"
    stopwords: true
  dense:
    embedding_model: "intfloat/multilingual-e5-base"
    dimension: 768
    metric: "inner_product"
    normalize: true
    top_k: 20
    batch_size: 32
  rrf:
    k: 60
    hybrid_top_k: 15
    weights: [0.4, 0.6]
  metadata_filter:
    enabled: true
    fields: ["cohort", "effective_date", "category"]

reranking:
  enabled: true
  # base@20 thay vì large@50: đo trên CPU 9.4s -> 1.7s/câu, R@5 giữ nguyên (5 câu grounded).
  # Đổi lại "BAAI/bge-reranker-large" + candidate_k 50 khi chạy GPU.
  model_name: "BAAI/bge-reranker-v2-m3"
  candidate_k: 20   # số ứng viên RRF đưa vào Cross-Encoder (benchmark C4 dùng 50 tường minh)
  top_n: 5
  batch_size: 16
  device: "cuda"
  score_threshold: 0.0

generation:
  provider: "gemini" # or "openai"
  model: "gemini-1.5-flash"
  temperature: 0.1
  max_output_tokens: 320
  parser_temperature: 0.0
  parser_max_tokens: 1024
  rewriter_temperature: 0.0
  rewriter_max_tokens: 512
  system_instruction: "Bạn là trợ lý ảo thông minh giải đáp quy chế và đào tạo đại học. Chỉ trả lời dựa trên tài liệu được cung cấp. Nếu không tìm thấy thông tin, hãy thẳng thắn thông báo."

api:
  host: "0.0.0.0"
  port: 8000
  title: "FPTUniQA API"
  version: "v1"

fees:
  common_fees_fallback:
    retake_exam_fee_vnd: 300000
    relearn_per_credit_vnd: 650000
    transcript_confirmation_fee_vnd: 50000
    dormitory_fuhl_per_term_vnd: 4000000
    graduation_fee_vnd: 1500000
    dormitory_note_campus: "FUHL Hòa Lạc"
  regional_discount_fallback:
    rate: 0.3
    campuses: ["Cần Thơ", "Đà Nẵng"]
  discount_notes:
    "Đà Nẵng": 0.3
    "Cần Thơ": 0.3
    "Quy Nhơn": 0.5
  ojt_policy:
    message: "Theo quy định đào tạo của Đại học FPT, trong giai đoạn thực tập tại doanh nghiệp (OJT - On the Job Training), sinh viên không phải đóng học phí chuyên ngành mà chỉ đóng chi phí quản lý thực tập (hoặc miễn học phí tùy chương trình)."
    source: "Quy chế đào tạo và thực tập OJT ĐH FPT"
  defaults:
    total_specialized_terms: 9
    cohort: "K22"
    academic_year: "2026"
