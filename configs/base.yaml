project:
  name: "university-qa"
  version: "0.1.0"
  description: "University RAG System"

data:
  raw_dir: "data/raw"
  interim_dir: "data/interim"
  processed_dir: "data/processed"
  corpus_path: "data/processed/corpus.jsonl"
  structured_path: "data/processed/structured_data.json"
  metadata_path: "data/processed/metadata.json"
  # Chuẩn hóa cấu hình Chunking theo tỷ lệ tiếng Việt (1 token ≈ 3 ký tự)
  chunk_size_tokens: 500
  chunk_overlap_tokens: 50
  min_chunk_tokens: 50
  chunk_size: 1500        # Quy đổi ký tự (~500 tokens)
  chunk_overlap: 200      # Quy đổi ký tự (~65 tokens)
  min_chunk_size: 150     # Quy đổi ký tự (~50 tokens)

retrieval:
  bm25:
    k1: 1.5
    b: 0.75
    top_k: 20
  dense:
    embedding_model: "intfloat/multilingual-e5-base"
    dimension: 768
    metric: "inner_product"
    normalize: true
    top_k: 20
  rrf:
    k: 60
    hybrid_top_k: 15

reranking:
  enabled: true
  model_name: "BAAI/bge-reranker-large"
  top_n: 5
  batch_size: 16

generation:
  provider: "gemini" # or "openai"
  model: "gemini-1.5-flash"
  temperature: 0.1
  max_output_tokens: 1024
  system_instruction: "Bạn là trợ lý ảo thông minh giải đáp quy chế và đào tạo đại học. Chỉ trả lời dựa trên tài liệu được cung cấp. Nếu không tìm thấy thông tin, hãy thẳng thắn thông báo."

api:
  host: "0.0.0.0"
  port: 8000
  title: "University QA API"
  version: "v1"
