# Cấu hình Benchmark và Thực nghiệm Khoa học
environment: "evaluation"

data:
  questions_path: "data/evaluation/questions.jsonl"
  golden_answers_path: "data/evaluation/golden_answers.jsonl"
  ood_questions_path: "data/evaluation/ood_questions.jsonl"
  output_report_dir: "experiments"

retrieval_benchmark:
  top_k_thresholds: [1, 3, 5, 10, 20]
  metrics:
    - "hit_rate"
    - "mrr"
    - "ndcg"
    - "precision"
    - "recall"

generation_benchmark:
  metrics:
    - "faithfulness"
    - "answer_relevance"
    - "hallucination_rate"
    - "ood_rejection_accuracy"

experiments:
  save_predictions: true
  comparison_runs:
    - name: "bm25_baseline"
      type: "bm25"
    - name: "dense_retrieval"
      type: "dense"
    - name: "hybrid_search"
      type: "hybrid"
    - name: "hybrid_with_reranker"
      type: "hybrid_rerank"
