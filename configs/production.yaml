# Cấu hình môi trường triển khai Production
environment: "production"
debug: false

logging:
  level: "INFO"
  format: "json"
  log_file: "logs/production.log"

retrieval:
  dense:
    device: "cuda"
    normalize: true
    top_k: 25
  bm25:
    top_k: 25
  rrf:
    k: 60
    hybrid_top_k: 15

reranking:
  enabled: true
  device: "cuda"
  top_n: 5
  batch_size: 32

api:
  host: "0.0.0.0"
  port: 8000
  workers: 4
  cors_origins:
    - "https://university.edu.vn"
    - "http://localhost:3000"
